<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <style>
    </style>
  </head>
  <body>
    <p>
      Rock Paper Scissors!
    </p>
    <button onclick = "
    playGame('Rock');
    ">
      Rock
    </button>
    <button onclick = "
    playGame('Paper');
    ">
      Paper
    </button>
    <button onclick = "
    playGame('Scissors');
    ">
      Scissors
    </button>

    <button onclick = "score.wins = 0;score.losses = 0;score.ties = 0;
    localStorage.removeItem('score');">
      Reset Button
    </button>
    <script>

      let score = JSON.parse(localStorage.getItem('score')) ||    {wins: 0,losses: 0,ties: 0};

      /*
      if(!score){
        score = {
          wins: 0,
          losses: 0,
          ties: 0
        };
      }
      */


      function playGame(playerMove){
        let computerMove= getComputerMove();

        let result = '';

        if(playerMove === 'Scissors'){
          if(computerMove === 'Rock'){
          result = 'Lose.';
          }
          else if(computerMove === 'Paper'){
            result = 'Win.';
          }
          else if(computerMove === 'Scissors'){
            result = 'got a Tie.';
          }
        }
        
        else if(playerMove === 'Paper'){
          if(computerMove === 'Rock'){
            result = 'Win.';
          }
          else if(computerMove === 'Paper'){
            result = 'got a Tie.';
          }
          else if(computerMove === 'Scissors'){
            result = 'Lose.';
          }
        }

        else if(playerMove === 'Rock'){
          if(computerMove === 'Rock'){
            result = 'got a Tie.';
          }
          else if(computerMove === 'Paper'){
            result = 'Lose.';
          }
          else if(computerMove === 'Scissors'){
            result = 'Win.';
          }
        }

        if(result === 'Win.'){
          score.wins += 1;
        }
        else if(result === 'Lose.'){
          score.losses += 1;
        }
        else if(result === 'got a Tie.'){
          score.ties += 1;
        }

        localStorage.setItem('score', JSON.stringify(score)); //stringify supports string only

        alert(`You picked ${playerMove}.Computer picked ${computerMove}.You ${result}
Wins: ${score.wins} , Losses: ${score.losses} , Ties: ${score.ties}`);
      }

      function getComputerMove(){
        let randNum = Math.random();
        let computerMove = '';
        if(randNum >= 0 && randNum < 1/3){
          computerMove = 'Rock';
        }
        else if(randNum >= 1/3 && randNum < 2/3){
          computerMove = 'Paper';
        }
        else if(randNum >= 2/3 && randNum < 1){
          computerMove = 'Scissors';
        }

        return computerMove;
        //return (returns undefined)
        // return 5;
        // console.log('After'); //does not print
      }
    </script>
  </body>
</html>
