<!DOCTYPE html>
<html>
  <head>
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="12 - rpscss.css">
  </head>
  <body>
    <p class = "title">
      Rock Paper Scissors!
    </p>
    <button class = "move-button" onclick = "
    playGame('rock');
    ">
    <img src = "rock-emoji.png" class = "move-icon" >
    </button>
    <button class = "move-button" onclick = "
    playGame('paper');
    ">
    <img src = "paper-emoji.png" class = "move-icon" >
    </button>
    <button class = "move-button" onclick = "
    playGame('scissors');
    ">
    <img src = "scissors-emoji.png" class = "move-icon" >
    </button>

    <p class = 'js-result result'></p>
    <p class = 'js-moves'>
      You
      <img src = "rock-emoji.png" class = "move-icon">
      <img src = "scissors-emoji.png" class = "move-icon">
      Computer
    </p>
    <p class = 'js-score score'></p>

    <button class = "reset" onclick = "score.wins = 0;score.losses = 0;score.ties = 0;
    localStorage.removeItem('score');
    updateScoreElement();
    ">
      Reset Button
    </button>
    <button class = "autoplay" onclick = "autoplay()">
      Auto Play
    </button>
    <script src="12 - rps.js">
    </script>
  </body>
</html>
