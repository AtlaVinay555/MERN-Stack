<!DOCTYPE html>
<html>
  <head>
    <title>DOM's Project</title>
    <style>
    </style>
  </head>
  <body>
    <p>Youtube Subscribe Button</p>
    <button onclick = "
    Subscribe();
    "
    class = 'js-SubElement'>Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <input placeholder = "Cost of order" class = 'js-input-cost' onkeydown="handleCostKeyDown(event); 
    ">
    <button onclick = "
    calculateCost();
    ">Calculate</button>
    <p class = "js-total-cost"></p>

    <script>

      String(25); //Number to String
      console.log('25' - 5); //Type Coersion - JS converts '25' to number and calculates it (for -,*,/)

      window.document;
      window.console.log('Window'); //No need to add window as JS does
      window.alert;

      function handleCostKeyDown(event){
        if(event.key === 'Enter'){
          calculateCost();
    }
      }
      function calculateCost(){
        const inputElement = document.querySelector('.js-input-cost');

        let cost = Number(inputElement.value); //String to Number

        if(cost < 40){
          cost = cost + 10;
        }

        document.querySelector('.js-total-cost')
        .innerHTML = `$${cost}`;
      }


      function Subscribe(){
        const buttonElement = document.querySelector('.js-SubElement');
        console.log(document.querySelector('.js-SubElement'));
        if(buttonElement.innerHTML === 'Subscribe'){
          buttonElement.innerHTML = 'Subscribed';
        }
        else{
          buttonElement.innerHTML = 'Subscribe';
        }
      }
    </script>
  </body>
</html>
